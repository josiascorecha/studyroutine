name: Android (AAB)

# Executado manualmente. Gera o Android App Bundle assinado com a CHAVE DE UPLOAD.
# Segredos necessários (Settings > Secrets and variables > Actions):
#   ANDROID_UPLOAD_KEYSTORE_B64  (keystore em base64)
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Variável (Settings > Variables): SYNC_ORIGIN, ex.: https://studyroutine.j2bot.com.br
on:
  workflow_dispatch:
    inputs:
      versionCode:
        description: "versionCode (inteiro crescente)"
        required: true
      versionName:
        description: "versionName (ex.: 0.1.0)"
        required: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - name: Build web do app
        working-directory: app
        env:
          VITE_SYNC_ORIGIN: ${{ vars.SYNC_ORIGIN }}
        run: |
          test -n "$VITE_SYNC_ORIGIN" || { echo "Defina a variável SYNC_ORIGIN no repositório"; exit 1; }
          npm ci && npm run build && npx cap sync android
      - name: Preparar keystore
        run: |
          echo "${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Gerar AAB
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ inputs.versionCode }}
          VERSION_NAME: ${{ inputs.versionName }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease
      - name: Remover keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: studyroutine-${{ inputs.versionName }}-aab
          path: app/android/app/build/outputs/bundle/release/*.aab
          retention-days: 14
