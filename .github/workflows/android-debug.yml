name: Android (APK de teste)

# Gera um APK de depuração para instalar direto no celular (sem a Play Store).
# Usa o servidor da variável SYNC_ORIGIN do repositório, ou o padrão abaixo.
# O pacote de teste se chama br.com.j2bot.studyroutine.debug e convive com a versão da loja.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/android-debug.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - name: Build web do app
        working-directory: app
        env:
          VITE_SYNC_ORIGIN: ${{ vars.SYNC_ORIGIN || 'https://studyroutine.j2bot.com.br' }}
        run: npm ci && npm run build && npx cap sync android
      - name: Gerar APK de teste
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: studyroutine-teste-apk
          path: app/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
