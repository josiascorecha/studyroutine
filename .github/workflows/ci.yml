name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: studyroutine
          POSTGRES_PASSWORD: ci-somente-teste
          POSTGRES_DB: studyroutine_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U studyroutine" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://studyroutine:ci-somente-teste@localhost:5432/studyroutine_test
      PGHOST: localhost
      PGUSER: studyroutine
      PGPASSWORD: ci-somente-teste
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Verificar ausência de segredos e dados pessoais
        run: bash scripts/check-public.sh
      - name: Servidor — instalar, tipos, testes, build
        working-directory: server
        run: npm ci && npm run typecheck && npm test && npm run build
      - name: Backup e restauração
        run: sudo apt-get install -y postgresql-client && bash scripts/test-backup-restore.sh
      - name: App — instalar, tipos, testes
        working-directory: app
        run: npm ci && npm run typecheck && npm test
      - name: App — build de teste (permite simular a data com ?hoje=)
        working-directory: app
        run: VITE_ALLOW_DATE_OVERRIDE=1 npm run build
      - name: E2E (celular e computador)
        working-directory: app
        env:
          DATABASE_URL: postgres://studyroutine:ci-somente-teste@localhost:5432/studyroutine_test
          IP_PEPPER: ci-pepper-somente-teste-0123456789abcdef
          STATIC_DIR: ../app/dist
          LOG_LEVEL: warn
        run: |
          npx playwright install --with-deps chromium
          (cd ../server && node dist/server.js &) && sleep 3
          npx playwright test
      - name: App — build de produção (sem simulação de data)
        working-directory: app
        run: npm run build && ! grep -qE 'get\(.hoje.\)' dist/assets/*.js
