# StudyRoutine — produção na VPS.
# Uso (na pasta deploy/):  bash scripts/deploy.sh   (ou: docker compose --env-file .env up -d --build)
#
# Projeto Docker próprio ("studyroutine"): containers, rede, volume e backups só dele.
# Não usa, não lê e não depende de nenhum outro projeto da VPS. Pode subir, parar
# ou ser apagado sem afetar os demais. Sem portas públicas: a aplicação escuta só em
# 127.0.0.1:${APP_PORT}; o proxy reverso do host encaminha o subdomínio para ela.
name: studyroutine

services:
  db:
    image: postgres:16-alpine
    container_name: studyroutine-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: studyroutine
      POSTGRES_USER: studyroutine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyroutine -d studyroutine"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: studyroutine-app:${APP_VERSION:-latest}
    container_name: studyroutine-app
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://studyroutine:${POSTGRES_PASSWORD}@db:5432/studyroutine
      TRUST_PROXY: "true"
    ports:
      - "127.0.0.1:${APP_PORT:-8088}:3000"
    networks: [internal]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  backup:
    image: postgres:16-alpine
    container_name: studyroutine-backup
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGHOST: db
      PGDATABASE: studyroutine
      PGUSER: studyroutine
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_DIR: /backups
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      TZ: America/Sao_Paulo
    volumes:
      - ./backups:/backups
      - ./scripts/backup-loop.sh:/backup-loop.sh:ro
    entrypoint: ["/bin/sh", "/backup-loop.sh"]
    networks: [internal]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

networks:
  internal:
    name: studyroutine_internal

volumes:
  pgdata:
    name: studyroutine_pgdata
