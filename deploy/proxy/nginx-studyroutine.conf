# Nginx no host (se a inspeção mostrar Nginx já em uso).
# 1) Copie para /etc/nginx/sites-available/studyroutine e crie o link em sites-enabled.
# 2) nginx -t && systemctl reload nginx
# 3) certbot --nginx -d studyroutine.j2bot.com.br   (emite o certificado só deste subdomínio)
#
# Privacidade: o app promete não guardar IPs junto com os dados. Por isso o log de acesso
# deste subdomínio fica desligado; erros continuam no error_log padrão.
server {
    listen 80;
    server_name studyroutine.j2bot.com.br;
    access_log off;
    # Lotes de sincronização cifrados (o servidor limita a 8 MB por requisição).
    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
